name: CI
on:
  push:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    # The source archive includes every tracked file; no docs bypass applies here.
    uses: ./.github/workflows/change-scope.yml
  verify:
    needs: scope
    if: needs.scope.outputs.docs-only != 'true'
    uses: ./.github/workflows/windows-checks.yml
    with:
      manifest: Cargo.toml
      frontend: true
      build-command: vp run build
  material:
    needs: scope
    if: needs.scope.outputs.docs-only != 'true'
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo build --locked --example material_probe
      - run: pwsh -NoProfile -File .github/scripts/test-material.ps1
      - run: cargo build --locked --example runtime_probe
      - run: pwsh -NoProfile -File .github/scripts/test-runtime.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-material
          path: material-probe-results/
  build-cache:
    needs: scope
    if: needs.scope.outputs.docs-only != 'true'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - run: pwsh -NoProfile -File scripts/test-build-cache.ps1
  test:
    needs: [scope, verify, material, build-cache]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          DOCS_ONLY: ${{ needs.scope.outputs.docs-only }}
        run: |
          test '${{ needs.scope.result }}' = success
          expected=success
          if [[ "$DOCS_ONLY" == true ]]; then expected=skipped; fi
          for result in '${{ needs.verify.result }}' '${{ needs.material.result }}' '${{ needs.build-cache.result }}'; do
            test "$result" = "$expected"
          done
  policy-check:
    uses: ./.github/workflows/project-policy.yml
  policy:
    needs: policy-check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.policy-check.result }}' = success
