name: Windows release
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      version-fields:
        description: JSON mapping version files to arrays of yq expressions
        type: string
        required: true
      frontend:
        type: boolean
        default: true
      manifest:
        type: string
        default: src-tauri/Cargo.toml
      build-command:
        type: string
        default: vp exec tauri build --ci --no-bundle -- --locked
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}
      - name: Validate release source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$(git rev-parse "$RELEASE_TAG")" --jq '.verification.verified' | grep -qx true
          test "$(git rev-parse "$RELEASE_TAG^{}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
      - uses: voidzero-dev/setup-vp@v1.22.0
        if: inputs.frontend
        with:
          version: 1.4.0
          run-install: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: ${{ inputs.manifest == 'Cargo.toml' && '.' || 'src-tauri' }} -> target
      - uses: MinoruSekine/setup-scoop@v5.0.1
      - name: Install packaging tools
        shell: pwsh
        run: |
          #requires -Version 7.0
          scoop install yq
          if (Test-Path ./scripts/scoop/cargo-about.json) { scoop install (Resolve-Path ./scripts/scoop/cargo-about.json).Path }
      - name: Check declared version fields
        shell: pwsh
        env:
          VERSION_FIELDS: ${{ inputs.version-fields }}
        run: |
          #requires -Version 7.0
          $ErrorActionPreference = 'Stop'
          $fields = $env:VERSION_FIELDS | ConvertFrom-Json -AsHashtable
          if ($fields -isnot [Collections.IDictionary] -or $fields.Count -eq 0) { throw 'Declare every package version file in a JSON object.' }
          foreach ($entry in $fields.GetEnumerator()) {
            $file = $entry.Key
            $format = if ([IO.Path]::GetExtension($file) -in '.toml', '.lock' -and $file -notlike '*package-lock.json') { 'toml' } else { 'json' }
            if ($entry.Value -isnot [array] -or $entry.Value.Count -eq 0) { throw "Declare a nonempty version field array for $file" }
            foreach ($field in $entry.Value) {
              if ($field -isnot [string] -or !$field) { throw "Invalid version expression for $file" }
              $values = @(yq -p $format -o json -r $field $file)
              if ($LASTEXITCODE -or $values.Count -ne 1 -or $values[0] -cne $env:RELEASE_TAG.Substring(1)) {
                throw "Tag and declared version differ: $file $field"
              }
            }
          }
      - name: Check and build
        shell: pwsh
        run: |
          #requires -Version 7.0
          if ('${{ inputs.frontend }}' -eq 'true') {
            vp install --frozen-lockfile
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          cargo fmt --manifest-path ${{ inputs.manifest }} -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo clippy --manifest-path ${{ inputs.manifest }} --locked --all-targets -- -D warnings
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --manifest-path ${{ inputs.manifest }} --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ('${{ inputs.frontend }}' -eq 'true') {
            vp run test
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          ${{ inputs.build-command }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Publish archive and notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          #requires -Version 7.0
          $archives = @(Get-ChildItem -LiteralPath dist -Filter '*.zip')
          $checksums = $archives | ForEach-Object { "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $checksums | Set-Content -Encoding utf8NoBOM dist/SHA256SUMS
          $version = $env:RELEASE_TAG.Substring(1)
          $sections = [regex]::Split([IO.File]::ReadAllText('CHANGELOG.md'), '(?m)^## ')
          $notes = $sections | Where-Object { $_.StartsWith("[$version]") } | Select-Object -First 1
          if (!$notes) { throw 'Version has no changelog section' }
          [IO.File]::WriteAllText('dist/release-notes.md', "## $notes", [Text.UTF8Encoding]::new($false))
          gh release create $env:RELEASE_TAG $archives.FullName dist/SHA256SUMS --verify-tag --title $env:RELEASE_TAG --notes-file dist/release-notes.md
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
