name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed tag to retry
        required: true
permissions:
  contents: write
jobs:
  release:
    uses: ./.github/workflows/windows-release.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      version-fields: '{"package.json":[".version"],"package-lock.json":[".version",".packages[\"\"].version"],"packages/linen-tray/Cargo.toml":[".package.version"],"Cargo.lock":[".package[] | select(.name == \"linen-tray\") | .version"]}'
      manifest: Cargo.toml
      build-command: vp run build
